<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FootMatch · Carte D1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body {
  min-height: 100vh;
  background: #050E05;
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 20px 100px;
  position: relative;
  overflow: hidden;
}

/* ── Pitch ──────────────────────────────────────────────────────────────── */
#pitch {
  position: fixed; inset: 0; z-index: 0;
}
#pitch svg { width: 100%; height: 100%; }
#pitch::after {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 55% at 50% 50%, rgba(0,18,0,0.30) 0%, rgba(3,9,3,0.88) 100%);
}

/* ── Floodlights ─────────────────────────────────────────────────────────── */
.flood {
  position: fixed; top: 50%; z-index: 0;
  width: 380px; height: 620px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.22;
  transform: translateY(-50%);
  pointer-events: none;
}
.flood-l { left: -150px; background: radial-gradient(ellipse, #60FF90, transparent 65%); }
.flood-r { right:-150px; background: radial-gradient(ellipse, #40FF70, transparent 65%); }

/* ── Wrapper ─────────────────────────────────────────────────────────────── */
.wrapper {
  position: relative;
  z-index: 1;
  width: 360px;
  padding-top: 50px;
}

/* ── Ball badge ──────────────────────────────────────────────────────────── */
.ball-badge {
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 88px; height: 88px;
  border-radius: 50%;
  background: radial-gradient(circle at 36% 34%, #223322, #080F08);
  box-shadow:
    0 0 0 2.5px rgba(200,158,0,0.60),
    0 0 0 6px   rgba(200,158,0,0.10),
    0 10px 34px rgba(0,0,0,0.80),
    0 0 36px    rgba(200,158,0,0.22);
  display: flex; align-items: center; justify-content: center;
  z-index: 5;
}

/* ── Card shell ──────────────────────────────────────────────────────────── */
.card {
  background: linear-gradient(170deg, #112011 0%, #0B180B 40%, #091409 100%);
  border-radius: 24px;
  border: 1.5px solid rgba(0,230,118,0.32);
  box-shadow:
    0 0 0 1px rgba(0,230,118,0.06),
    inset 0 0 40px rgba(0,230,118,0.04),
    0 0 40px rgba(0,230,118,0.18),
    0 0 90px rgba(0,230,118,0.08),
    0 50px 100px rgba(0,0,0,0.95);
  overflow: hidden;
  position: relative;
  transform-style: preserve-3d;
}

/* Jersey stripe texture */
.card::before {
  content: '';
  position: absolute; inset: 0; z-index: 0;
  background: repeating-linear-gradient(
    -52deg,
    transparent 0, transparent 18px,
    rgba(0,230,118,0.018) 18px, rgba(0,230,118,0.018) 20px
  );
  pointer-events: none;
}

/* Top shimmer edge */
.card::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px; z-index: 3;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(0,230,118,0.20) 20%,
    rgba(0,230,118,0.75) 50%,
    rgba(0,230,118,0.20) 80%,
    transparent 100%
  );
}

/* Holographic foil overlay */
.holo {
  position: absolute; inset: 0; z-index: 1;
  border-radius: 24px;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  background: conic-gradient(
    from var(--holo-angle, 0deg) at var(--holo-x, 50%) var(--holo-y, 50%),
    rgba(0,230,118,0.00) 0deg,
    rgba(100,255,160,0.06) 60deg,
    rgba(0,230,200,0.08) 120deg,
    rgba(180,255,120,0.05) 180deg,
    rgba(0,200,118,0.07) 240deg,
    rgba(100,255,160,0.04) 300deg,
    rgba(0,230,118,0.00) 360deg
  );
  mix-blend-mode: screen;
}
.card:hover .holo { opacity: 1; }

/* Sweep shine on hover */
.shine {
  position: absolute; inset: 0; z-index: 2;
  border-radius: 24px;
  pointer-events: none;
  background: linear-gradient(
    105deg,
    transparent 30%,
    rgba(255,255,255,0.04) 50%,
    transparent 70%
  );
  transform: translateX(-100%);
  transition: transform 0s;
}
.card:hover .shine {
  transform: translateX(100%);
  transition: transform 0.55s ease;
}

/* Corner marks */
.card-corner {
  position: absolute;
  width: 18px; height: 18px;
  z-index: 3;
  pointer-events: none;
}
.card-corner::before,
.card-corner::after {
  content: '';
  position: absolute;
  background: rgba(0,230,118,0.40);
}
.card-corner::before { width: 1px; height: 100%; }
.card-corner::after  { width: 100%; height: 1px; }
.card-corner.tl { top: 12px; left: 12px; }
.card-corner.tr { top: 12px; right: 12px; transform: scaleX(-1); }
.card-corner.bl { bottom: 12px; left: 12px; transform: scaleY(-1); }
.card-corner.br { bottom: 12px; right: 12px; transform: scale(-1); }

.card > *:not(.holo):not(.shine):not(.card-corner) { position: relative; z-index: 4; }

/* ── HEADER BAND ─────────────────────────────────────────────────────────── */
.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 28px 24px 0;
  background: linear-gradient(180deg, rgba(0,230,118,0.06) 0%, transparent 100%);
}

/* Score */
.score-block { position: relative; }

.score-arc {
  position: absolute;
  top: -6px; left: -12px;
  width: 90px; height: 90px;
  pointer-events: none;
}

.score-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 96px;
  line-height: 0.85;
  color: #00E676;
  text-shadow:
    0 0 16px rgba(0,230,118,0.90),
    0 0 48px rgba(0,230,118,0.50),
    0 0 90px rgba(0,230,118,0.22);
  letter-spacing: 1px;
  position: relative;
}
.score-lbl {
  font-size: 9px; font-weight: 800; letter-spacing: 5px;
  color: rgba(0,230,118,0.38);
  text-transform: uppercase;
  margin-top: 4px;
  padding-left: 3px;
}

/* Level block */
.level-block {
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
  padding-top: 2px;
}
.tier-badge {
  font-size: 8px; font-weight: 800; letter-spacing: 2.5px;
  color: #00E676;
  padding: 3px 10px;
  border: 1px solid rgba(0,230,118,0.35);
  border-radius: 100px;
  background: rgba(0,230,118,0.06);
  text-transform: uppercase;
}
.level-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 58px; line-height: 0.9;
  color: #00E676;
  letter-spacing: 3px;
  text-shadow:
    0 0 14px rgba(0,230,118,0.80),
    0 0 40px rgba(0,230,118,0.35);
}
.level-shield {
  width: 32px; height: 32px;
  background: rgba(0,230,118,0.06);
  border: 1px solid rgba(0,230,118,0.20);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 10px rgba(0,230,118,0.08);
}

/* ── HERO ─────────────────────────────────────────────────────────────────── */
.hero-zone {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px 0 8px;
  position: relative;
}

/* Radial aura behind bolt */
.hero-zone::before {
  content: '';
  position: absolute;
  width: 160px; height: 80px;
  background: radial-gradient(ellipse, rgba(255,160,0,0.18) 0%, transparent 70%);
  bottom: 10px;
  pointer-events: none;
}

.bolt-wrap {
  filter:
    drop-shadow(0 0 16px rgba(255,190,0,0.90))
    drop-shadow(0 0 40px rgba(255,120,0,0.55))
    drop-shadow(0 10px 28px rgba(0,0,0,0.65));
}

/* ── DIVIDER + NAME ──────────────────────────────────────────────────────── */
.name-zone {
  text-align: center;
  padding: 0 24px 14px;
}

.divider {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px;
}
.divider-line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,230,118,0.20));
}
.divider-line.r {
  background: linear-gradient(90deg, rgba(0,230,118,0.20), transparent);
}
.divider-center {
  display: flex; align-items: center; gap: 5px;
  flex-shrink: 0;
}
.divider-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(210,165,0,0.85);
  box-shadow: 0 0 8px rgba(210,165,0,0.75), 0 0 18px rgba(180,120,0,0.40);
}
.divider-dash {
  width: 14px; height: 1px;
  background: rgba(0,230,118,0.25);
}

.player-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 38px; letter-spacing: 5px; line-height: 1;
  color: #FFFFFF;
  text-shadow: 0 2px 20px rgba(0,0,0,0.60), 0 0 30px rgba(0,230,118,0.10);
  margin-bottom: 5px;
}
.player-sub {
  font-size: 10px; font-weight: 700; letter-spacing: 3.5px;
  color: #00E676; opacity: 0.55;
  text-transform: uppercase;
}

/* ── STATS ────────────────────────────────────────────────────────────────── */
.stats { padding: 0; }

.stat-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 20px;
  border-top: 1px solid rgba(0,230,118,0.06);
  position: relative;
  transition: background 0.2s;
}
.stat-row::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
  border-radius: 0 2px 2px 0;
  transition: background 0.2s;
}
.stat-row:hover { background: rgba(0,230,118,0.025); }
.stat-row:hover::before { background: rgba(0,230,118,0.50); }

.s-ico {
  width: 46px; height: 46px;
  border-radius: 13px;
  background: linear-gradient(135deg, rgba(0,30,12,0.90), rgba(0,18,8,0.95));
  border: 1px solid rgba(0,230,118,0.18);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: #00E676;
  box-shadow:
    0 2px 12px rgba(0,0,0,0.40),
    0 0 16px rgba(0,230,118,0.06),
    inset 0 1px 0 rgba(0,230,118,0.12);
}
.s-ico svg { width: 22px; height: 22px; }

.s-text { flex: 1; min-width: 0; }
.s-name {
  font-size: 14px; font-weight: 700; color: #E8F5EE; line-height: 1.25;
  letter-spacing: 0.1px;
}
.s-sub {
  font-size: 10px; font-weight: 500;
  color: rgba(140,200,165,0.32);
  margin-top: 2px;
  letter-spacing: 0.2px;
}

.s-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 38px;
  color: #00E676;
  text-shadow: 0 0 14px rgba(0,230,118,0.60);
  letter-spacing: 1px;
  line-height: 1;
  flex-shrink: 0;
}

/* Notes row */
.s-notes-right {
  display: flex; flex-direction: column; align-items: flex-end;
  flex-shrink: 0; gap: 1px;
}
.s-notes-top {
  display: flex; align-items: center; gap: 4px; line-height: 1;
}
.s-star {
  font-size: 18px;
  color: #FFB800;
  text-shadow: 0 0 10px rgba(255,184,0,0.70);
  line-height: 1;
}
.s-notes-avg {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 38px;
  color: #00E676;
  text-shadow: 0 0 14px rgba(0,230,118,0.60);
  letter-spacing: 1px; line-height: 1;
}
.s-notes-count {
  font-size: 10px; font-weight: 600;
  color: rgba(140,200,165,0.32);
  letter-spacing: 0.5px;
}

/* ── FOOTER ──────────────────────────────────────────────────────────────── */
.card-footer {
  padding: 14px 20px 20px;
  border-top: 1px solid rgba(0,230,118,0.06);
}

.prog-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
}

.prog-pill {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px; letter-spacing: 1.5px;
  padding: 5px 13px;
  border-radius: 100px;
  white-space: nowrap;
  line-height: 1;
}
.prog-pill.cur {
  color: #00E676;
  border: 1.5px solid rgba(0,230,118,0.45);
  background: rgba(0,230,118,0.08);
  box-shadow: 0 0 12px rgba(0,230,118,0.14);
}
.prog-pill.nxt {
  color: rgba(0,230,118,0.28);
  border: 1px solid rgba(0,230,118,0.12);
  background: transparent;
}

.prog-track {
  flex: 1; height: 6px; border-radius: 100px;
  background: rgba(0,230,118,0.08);
  position: relative; overflow: visible;
}
.prog-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  border-radius: 100px;
  background: linear-gradient(90deg, rgba(0,180,90,0.6), #00E676 80%, #80FFB8);
  box-shadow: 0 0 14px rgba(0,230,118,0.60);
  overflow: hidden;
}
/* Shimmer on fill */
.prog-fill::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg,
    transparent 0%, rgba(255,255,255,0.28) 50%, transparent 100%
  );
  transform: translateX(-100%);
  animation: shimmer 2.4s ease-in-out infinite;
}
@keyframes shimmer {
  0%   { transform: translateX(-100%); }
  60%  { transform: translateX(200%); }
  100% { transform: translateX(200%); }
}

.prog-dot {
  position: absolute; right: -6px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px; border-radius: 50%;
  background: #00E676;
  border: 2.5px solid #091409;
  box-shadow:
    0 0 12px rgba(0,230,118,0.90),
    0 0 24px rgba(0,230,118,0.45);
}

.prog-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.prog-info {
  font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
  color: #00E676; opacity: 0.50;
}
.card-serial {
  font-size: 10px; font-weight: 500; letter-spacing: 1px;
  color: rgba(0,230,118,0.22);
  font-variant-numeric: tabular-nums;
}
</style>
</head>

<!-- Pitch background -->
<div id="pitch" aria-hidden="true">
  <svg viewBox="0 0 1680 1050" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grass" x="105" y="49" width="84" height="952" patternUnits="userSpaceOnUse">

  </svg>
</div>

<div class="flood flood-l" aria-hidden="true"></div>
<div class="flood flood-r" aria-hidden="true"></div>

<!-- ══════════════ CARD ══════════════ -->
<div class="wrapper">

  <!-- Football badge -->
  <div class="ball-badge">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="26" cy="26" r="24" fill="#F0F0F0" stroke="#DDD" stroke-width="0.5"/>
      <!-- Black pentagon center -->
      <polygon points="26,14 32.5,19 30,26.5 22,26.5 19.5,19" fill="#1A1A1A"/>
      <!-- Top-left -->
      <polygon points="14,20 20,16 19.5,19 14,22" fill="#1A1A1A"/>
      <!-- Top-right -->
      <polygon points="38,20 32,16 32.5,19 38,22" fill="#1A1A1A"/>
      <!-- Bottom-left -->
      <polygon points="16,34 20,28 22,26.5 18,31" fill="#1A1A1A"/>
      <!-- Bottom-right -->
      <polygon points="36,34 32,28 30,26.5 34,31" fill="#1A1A1A"/>
      <!-- Bottom -->
      <polygon points="26,40 21,34 22,26.5 30,26.5 31,34" fill="#1A1A1A"/>
      <circle cx="26" cy="26" r="24" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
      <!-- Shine -->
      <ellipse cx="20" cy="18" rx="6" ry="3.5" fill="rgba(255,255,255,0.40)" transform="rotate(-20,20,18)"/>
    </svg>
  </div>

  <div class="card" id="card">

    <!-- Holographic foil -->
    <div class="holo" id="holo"></div>
    <div class="shine"></div>

    <!-- Corner marks -->
    <div class="card-corner tl"></div>
    <div class="card-corner tr"></div>
    <div class="card-corner bl"></div>
    <div class="card-corner br"></div>

    <!-- HEADER -->
    <div class="card-header">
      <div class="score-block">
        <!-- Score arc SVG -->
        <svg class="score-arc" viewBox="0 0 90 90" fill="none">
          <circle cx="45" cy="45" r="40" stroke="rgba(0,230,118,0.07)" stroke-width="2"/>
          <path d="M 45 5 A 40 40 0 1 1 44.99 5"
            stroke="rgba(0,230,118,0.18)" stroke-width="1.5"
            stroke-dasharray="220 252"
            stroke-dashoffset="0"
            stroke-linecap="round"/>
        </svg>
        <div class="score-num">65</div>
        <div class="score-lbl">Score</div>
      </div>
      <div class="level-block">
        <div class="tier-badge">District</div>
        <div class="level-num">D1</div>
        <div class="level-shield">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round"
               style="width:16px;height:16px;color:#00E676">
            <path d="M12 2 L20 6 L20 12 C20 17 16 21 12 22 C8 21 4 17 4 12 L4 6 Z"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- HERO: lightning bolt -->
    <div class="hero-zone">
      <div class="bolt-wrap">
        <svg width="90" height="130" viewBox="0 0 88 128" fill="none">
          <defs>
            <linearGradient id="lg1" x1="44" y1="0" x2="44" y2="128" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#FFE84D"/>
              <stop offset="35%"  stop-color="#FFAA00"/>
              <stop offset="100%" stop-color="#C04A00"/>
            </linearGradient>
            <linearGradient id="lg2" x1="18" y1="8" x2="50" y2="68" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="rgba(255,255,220,0.70)"/>
              <stop offset="100%" stop-color="rgba(255,255,220,0)"/>
            </linearGradient>
          </defs>
          <path d="M56 4 L10 70 H40 L32 124 L82 54 H50 Z"
            fill="url(#lg1)"
            stroke="rgba(255,220,60,0.30)" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M52 12 L18 66 H44 L38 108 L72 60 H46 Z"
            fill="url(#lg2)" opacity="0.50"/>
        </svg>
      </div>
    </div>

    <!-- NAME -->
    <div class="name-zone">
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-center">
          <div class="divider-dash"></div>
          <div class="divider-dot"></div>
          <div class="divider-dash"></div>
        </div>
        <div class="divider-line r"></div>
      </div>
      <div class="player-name">BENTEN66</div>
      <div class="player-sub">District &nbsp;·&nbsp; D1</div>
    </div>

    <!-- STATS -->
    <div class="stats">

      <div class="stat-row">
        <div class="s-ico">

<script>
const wrapper = document.querySelector('.wrapper');
const card    = document.getElementById('card');
const holo    = document.getElementById('holo');
let raf;

wrapper.addEventListener('mousemove', e => {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const r  = card.getBoundingClientRect();
    const dx = (e.clientX - r.left  - r.width  / 2) / (r.width  / 2);
    const dy = (e.clientY - r.top   - r.height / 2) / (r.height / 2);

    card.style.transition = 'none';
    card.style.transform  = `perspective(900px) rotateY(${dx*9}deg) rotateX(${-dy*9}deg) translateZ(16px)`;

    /* Holographic foil shifts with tilt */
    const ax = ((e.clientX - r.left) / r.width  * 100).toFixed(1);
    const ay = ((e.clientY - r.top)  / r.height * 100).toFixed(1);
    const angle = (dx * 30 + 60).toFixed(1);
    holo.style.setProperty('--holo-x', ax + '%');
    holo.style.setProperty('--holo-y', ay + '%');
    holo.style.setProperty('--holo-angle', angle + 'deg');
  });
});

wrapper.addEventListener('mouseleave', () => {
  cancelAnimationFrame(raf);
  card.style.transition = 'transform .55s cubic-bezier(.22,.68,0,1.2)';
  card.style.transform  = '';
});
</script>
